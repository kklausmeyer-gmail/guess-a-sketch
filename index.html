<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw & Guess!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Bubblegum Sans', cursive;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #a8edea 50%, #fed6e3 75%, #d299c2 100%);
  background-size: 400% 400%;
  animation: bgShift 12s ease infinite;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* TITLE SCREEN */
#title-screen {
  text-align: center;
  animation: fadeIn 0.8s ease;
}

#title-screen h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 4rem;
  color: #fff;
  text-shadow: 4px 4px 0 #ff6b6b, 6px 6px 0 #4ecdc4;
  animation: bounce 1.5s ease infinite;
  margin-bottom: 10px;
}

#title-screen p {
  font-size: 1.5rem;
  color: #555;
  margin-bottom: 15px;
}

.level-label {
  font-size: 1.3rem !important;
  margin-bottom: 10px !important;
}

.level-select {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 25px;
}

.level-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  width: 60px;
  height: 60px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  color: #555;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  transition: all 0.15s;
}

.level-btn:hover { transform: translateY(-2px); background: #fff; }
.level-btn.selected {
  background: linear-gradient(135deg, #00b894, #00cec9);
  color: #fff;
  box-shadow: 0 4px 0 #019875;
}

#high-scores-display {
  margin-top: 30px;
  background: rgba(255,255,255,0.8);
  border-radius: 20px;
  padding: 15px 25px;
  display: none;
}

#high-scores-display h3 {
  font-family: 'Fredoka One', cursive;
  color: #6c5ce7;
  margin-bottom: 10px;
}

#high-scores-display ol {
  text-align: left;
  padding-left: 25px;
  color: #333;
}

#high-scores-display li {
  margin: 5px 0;
}

#play-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 2.5rem;
  padding: 20px 60px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff6b6b, #feca57);
  color: #fff;
  cursor: pointer;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  box-shadow: 0 8px 0 #e55a5a, 0 12px 20px rgba(0,0,0,0.2);
  transition: all 0.1s;
}

#play-btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #e55a5a, 0 15px 25px rgba(0,0,0,0.2); }
#play-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #e55a5a, 0 6px 10px rgba(0,0,0,0.2); }

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* GAME SCREEN */
#game-screen {
  display: none;
  text-align: center;
  width: 95%;
  max-width: 750px;
  animation: fadeIn 0.5s ease;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.stat-box {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  color: #fff;
  background: rgba(0,0,0,0.25);
  padding: 8px 18px;
  border-radius: 30px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
}


canvas {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.18), 0 0 0 6px #fff, 0 0 0 10px rgba(78,205,196,0.5);
  display: block;
  margin: 0 auto 12px;
  max-width: 100%;
}

#hint-area {
  margin-bottom: 12px;
  min-height: 50px;
}

#next-btn {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 1.4rem;
  padding: 12px 40px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #00b894, #00cec9);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 0 #019875, 0 6px 12px rgba(0,0,0,0.15);
  transition: all 0.1s;
  margin-right: 10px;
}

#next-btn:hover { transform: translateY(-2px); }
#next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #019875; }
#next-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

#hint-btn {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 1.2rem;
  padding: 10px 30px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #a29bfe, #6c5ce7);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 0 #5a4bd1, 0 6px 12px rgba(0,0,0,0.15);
  transition: all 0.1s;
}

#hint-btn:hover { transform: translateY(-2px); }
#hint-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a4bd1; }
#hint-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

#hint-text {
  font-size: 1.2rem;
  color: #6c5ce7;
  margin-top: 8px;
  font-style: italic;
  animation: fadeIn 0.4s ease;
}

.words-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-top: 5px;
}

.word-btn {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 1.25rem;
  padding: 14px 8px;
  border: none;
  border-radius: 16px;
  color: #fff;
  cursor: pointer;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  box-shadow: 0 5px 0 rgba(0,0,0,0.2), 0 6px 15px rgba(0,0,0,0.1);
  transition: all 0.15s;
  word-break: break-word;
}

.word-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
.word-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
.word-btn:disabled { opacity: 0.45; cursor: default; transform: none; filter: none; }

.word-btn.correct-pick {
  animation: correctPop 0.5s ease;
  background: #2ecc71 !important;
  box-shadow: 0 0 20px #2ecc71;
}

.word-btn.wrong-pick {
  animation: shake 0.45s ease;
}

@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-10px); }
  80% { transform: translateX(10px); }
}

/* button colors */
.btn-c0 { background: #ff6b6b; } .btn-c1 { background: #feca57; color: #664d00; text-shadow: none; }
.btn-c2 { background: #48dbfb; } .btn-c3 { background: #ff9ff3; }
.btn-c4 { background: #54a0ff; } .btn-c5 { background: #5f27cd; }
.btn-c6 { background: #01a3a4; } .btn-c7 { background: #f368e0; }
.btn-c8 { background: #ff9f43; } .btn-c9 { background: #10ac84; }

/* GAME OVER */
#gameover-screen {
  display: none;
  text-align: center;
  animation: fadeIn 0.6s ease;
}

#gameover-screen h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: #fff;
  text-shadow: 3px 3px 0 #e55a5a;
  margin-bottom: 15px;
}

#gameover-screen p {
  font-size: 1.4rem;
  color: #333;
  margin-bottom: 15px;
}

#high-score-entry {
  margin-bottom: 20px;
}

#high-score-entry p {
  font-family: 'Fredoka One', cursive;
  color: #feca57;
  font-size: 1.6rem;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
}

#player-name {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 1.3rem;
  padding: 12px 20px;
  border: 3px solid #6c5ce7;
  border-radius: 25px;
  outline: none;
  width: 180px;
  text-align: center;
}

#player-name:focus {
  border-color: #a29bfe;
  box-shadow: 0 0 10px rgba(162,155,254,0.5);
}

#save-score-btn {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 1.2rem;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #00b894, #00cec9);
  color: #fff;
  cursor: pointer;
  margin-left: 10px;
  box-shadow: 0 4px 0 #019875;
  transition: all 0.1s;
}

#save-score-btn:hover { transform: translateY(-2px); }
#save-score-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #019875; }

#final-high-scores {
  background: rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 15px 30px;
  margin-bottom: 20px;
  display: none;
}

#final-high-scores h3 {
  font-family: 'Fredoka One', cursive;
  color: #6c5ce7;
  margin-bottom: 10px;
}

#final-high-scores ol {
  text-align: left;
  padding-left: 25px;
  color: #333;
  margin: 0;
}

#final-high-scores li {
  margin: 5px 0;
}

#final-high-scores li.current-score {
  color: #00b894;
  font-weight: bold;
}

/* CELEBRATION */
#celebration {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 999;
}

.confetti-piece {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  animation: confettiFall 1.2s ease forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* LEVEL-UP BANNER */
#level-banner {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: #fff;
  text-shadow: 3px 3px 0 #e55a5a;
  background: rgba(0,0,0,0.5);
  padding: 30px 60px;
  border-radius: 30px;
  z-index: 1000;
  animation: popIn 0.5s ease;
}

@keyframes popIn {
  0% { transform: translate(-50%, -50%) scale(0); }
  70% { transform: translate(-50%, -50%) scale(1.15); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* SCORE POPUP */
.score-popup {
  position: absolute;
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  color: #2ecc71;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  animation: floatUp 1s ease forwards;
  pointer-events: none;
  z-index: 500;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
}

@media (max-width: 600px) {
  #title-screen h1 { font-size: 2.5rem; }
  .words-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .word-btn { font-size: 0.95rem; padding: 10px 4px; }
  .stat-box { font-size: 1rem; padding: 6px 12px; }
  canvas { width: 100%; height: auto; }
}
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <h1>Draw & Guess!</h1>
  <p>Can you guess what I'm drawing?</p>
  <p class="level-label">How many levels?</p>
  <div class="level-select">
    <button class="level-btn" onclick="selectMaxLevel(5)">5</button>
    <button class="level-btn selected" onclick="selectMaxLevel(10)">10</button>
    <button class="level-btn" onclick="selectMaxLevel(20)">20</button>
  </div>
  <button id="play-btn" onclick="startGame()">Play!</button>
  <div id="high-scores-display"></div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div class="top-bar">
    <div class="stat-box" id="score-display">Score: 100</div>
    <div class="stat-box" id="hints-display">Hints: 3</div>
    <div class="stat-box" id="level-display">Level 1 / 10</div>
  </div>
  <canvas id="draw-canvas" width="500" height="380"></canvas>
  <div id="hint-area">
    <button id="next-btn" onclick="showNextPath()">Next Line</button>
    <button id="hint-btn" onclick="showHint()">Hint</button>
    <div id="hint-text"></div>
  </div>
  <div class="words-grid" id="words-grid"></div>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameover-screen">
  <h1 id="gameover-title">Game Over!</h1>
  <p id="final-score-text"></p>
  <p id="final-level-text"></p>
  <div id="high-score-entry" style="display:none;">
    <p>You got a high score!</p>
    <input type="text" id="player-name" placeholder="Your name" maxlength="12">
    <button id="save-score-btn" onclick="saveHighScore()">Save</button>
  </div>
  <div id="final-high-scores"></div>
  <button id="play-btn" onclick="startGame()">Play Again!</button>
</div>

<!-- CELEBRATION OVERLAY -->
<div id="celebration"></div>
<div id="level-banner"></div>

// Word pools per difficulty tier
const EASY_WORDS = ['sun','heart','star','house','tree','flower','fish','moon','apple','ball','rainbow','cat','cloud','balloon','egg','lollipop','mushroom','cherry','kite'];
const MEDIUM_WORDS = ['dog','bird','car','boat','butterfly','icecream','pizza','umbrella','rocket','snowman','frog','bee','turtle','cupcake','pumpkin','ladybug','crab'];
const HARD_WORDS = ['dinosaur','elephant','guitar','castle','airplane','octopus','robot','dragon','unicorn','train','helicopter','penguin','giraffe','crown','shark'];

const ALL_WORDS = [...EASY_WORDS, ...MEDIUM_WORDS, ...HARD_WORDS];

// Display names (capitalize first letter)
function displayName(w) {
  if (w === 'icecream') return 'Ice Cream';
  return w.charAt(0).toUpperCase() + w.slice(1);
}

// ============ GAME STATE ============
let score = 100;
let level = 1;
let maxLevel = 10;
let currentWord = '';
let drawStartTime = 0;
let animFrameId = null;
let hintUsed = false;
let hintsRemaining = 3;
let roundActive = false;
let usedWords = [];
let currentPathIndex = 0;
let currentPaths = [];
let pendingHighScore = null;

// ============ HIGH SCORES ============
function loadHighScores() {
  const stored = localStorage.getItem('drawGuessHighScores');
  return stored ? JSON.parse(stored) : [];
}

function saveHighScores(scores) {
  localStorage.setItem('drawGuessHighScores', JSON.stringify(scores));
}

function isHighScore(score) {
  const scores = loadHighScores();
  if (scores.length < 10) return true;
  return score > scores[scores.length - 1].score;
}

function addHighScore(name, score, levels) {
  const scores = loadHighScores();
  scores.push({ name, score, levels, date: Date.now() });
  scores.sort((a, b) => b.score - a.score);
  if (scores.length > 10) scores.length = 10;
  saveHighScores(scores);
  return scores;
}

function displayHighScores(containerId, highlightScore) {
  const container = document.getElementById(containerId);
  const scores = loadHighScores();

  if (scores.length === 0) {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  let html = '<h3>High Scores</h3><ol>';
  scores.forEach(s => {
    const isHighlight = highlightScore && s.score === highlightScore.score && s.name === highlightScore.name;
    html += `<li class="${isHighlight ? 'current-score' : ''}">${s.name}: ${s.score} pts (${s.levels} levels)</li>`;
  });
  html += '</ol>';
  container.innerHTML = html;
}

function selectMaxLevel(num) {
  maxLevel = num;
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.textContent === String(num));
  });
}

const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

// ============ SCREENS ============
function showScreen(id) {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById(id).style.display = 'block';
}

// ============ START GAME ============
function startGame() {
  score = 100;
  level = 1;
  hintsRemaining = 3;
  usedWords = [];
  pendingHighScore = null;
  showScreen('game-screen');
  updateUI();
  startRound();
}

// Show high scores on title screen when page loads
function initTitleScreen() {
  displayHighScores('high-scores-display');
}
window.addEventListener('load', initTitleScreen);

// ============ UI UPDATES ============
function updateUI() {
  document.getElementById('score-display').textContent = 'Score: ' + score;
  document.getElementById('level-display').textContent = 'Level ' + level + ' / ' + maxLevel;
  document.getElementById('hints-display').textContent = 'Hints: ' + hintsRemaining;
}

// ============ PICK WORD ============
function pickWord() {
  let pool;
  if (level <= 3) pool = EASY_WORDS;
  else if (level <= 6) pool = MEDIUM_WORDS;
  else pool = HARD_WORDS;

  const available = pool.filter(w => !usedWords.includes(w) && DRAWINGS[w]);
  if (available.length === 0) {
    // Reset used words for this tier if exhausted
    const tierUsed = pool.filter(w => usedWords.includes(w));
    tierUsed.forEach(w => usedWords.splice(usedWords.indexOf(w), 1));
    return pickWord();
  }
  const word = available[Math.floor(Math.random() * available.length)];
  usedWords.push(word);
  return word;
}

// ============ GENERATE DISTRACTORS ============
function getDistractors(correct, count) {
  const others = ALL_WORDS.filter(w => w !== correct);
  // Shuffle
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  return others.slice(0, count);
}

// ============ START ROUND ============
function startRound() {
  // Check if game is complete
  if (level > maxLevel) {
    gameOver(true); // true = completed all levels
    return;
  }

  roundActive = true;
  hintUsed = false;
  document.getElementById('hint-text').textContent = '';
  document.getElementById('hint-btn').disabled = hintsRemaining <= 0;
  document.getElementById('next-btn').disabled = false;

  currentWord = pickWord();
  currentPaths = DRAWINGS[currentWord].paths;
  currentPathIndex = 0;

  const distractors = getDistractors(currentWord, 9);
  const choices = [currentWord, ...distractors];
  // Shuffle choices
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  // Render buttons
  const grid = document.getElementById('words-grid');
  grid.innerHTML = '';
  choices.forEach((word, i) => {
    const btn = document.createElement('button');
    btn.className = 'word-btn btn-c' + (i % 10);
    btn.textContent = displayName(word);
    btn.onclick = () => handleGuess(word, btn);
    grid.appendChild(btn);
  });

  // Clear canvas and draw first path
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStartTime = Date.now();
  animateCurrentPath();
}

// ============ SHOW NEXT PATH ============
function showNextPath() {
  if (!roundActive) return;

  currentPathIndex++;

  if (currentPathIndex >= currentPaths.length) {
    // All paths shown, disable the next button
    document.getElementById('next-btn').disabled = true;
    return;
  }

  animateCurrentPath();
}

// ============ ANIMATE CURRENT PATH ============
function animateCurrentPath() {
  if (animFrameId) cancelAnimationFrame(animFrameId);

  const pathToAnimate = currentPaths[currentPathIndex];
  const animDuration = 400; // ms to animate one path
  const startTime = performance.now();

  function draw(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / animDuration, 1);

    // Redraw all completed paths
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < currentPathIndex; i++) {
      drawPath(currentPaths[i], 1);
    }

    // Animate the current path
    drawPath(pathToAnimate, progress);

    if (progress < 1 && roundActive) {
      animFrameId = requestAnimationFrame(draw);
    }
  }

  animFrameId = requestAnimationFrame(draw);
}

// ============ DRAWING ENGINE ============
// Drawing is now handled by animateCurrentPath() above

function drawPath(p, progress) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (p.t === 'line') {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    ctx.moveTo(p.x1, p.y1);
    const tx = p.x1 + (p.x2 - p.x1) * progress;
    const ty = p.y1 + (p.y2 - p.y1) * progress;
    ctx.lineTo(tx, ty);
    ctx.stroke();
  }
  else if (p.t === 'circle') {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    const endAngle = Math.PI * 2 * progress;
    ctx.arc(p.cx, p.cy, p.r, 0, endAngle);
    if (p.fill && progress >= 1) {
      ctx.fillStyle = p.fill;
      ctx.fill();
    }
    ctx.stroke();
  }
  else if (p.t === 'ellipse') {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    const endAngle = Math.PI * 2 * progress;
    ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, endAngle);
    if (p.fill && progress >= 1) {
      ctx.fillStyle = p.fill;
      ctx.fill();
    }
    ctx.stroke();
  }
  else if (p.t === 'arc') {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    const range = p.ea - p.sa;
    const endAngle = p.sa + range * progress;
    ctx.arc(p.cx, p.cy, p.r, p.sa, endAngle);
    if (p.fill && progress >= 1) {
      ctx.fillStyle = p.fill;
      ctx.fill();
    }
    ctx.stroke();
  }
  else if (p.t === 'rect') {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    const rw = p.rw * progress;
    const rh = p.rh * progress;
    if (p.fill && progress >= 1) {
      ctx.fillStyle = p.fill;
      ctx.fillRect(p.x, p.y, p.rw, p.rh);
    }
    ctx.strokeRect(p.x, p.y, rw, rh);
  }
  else if (p.t === 'bezier') {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.w;
    ctx.moveTo(p.x1, p.y1);
    // Approximate progress along bezier
    const steps = 30;
    const maxStep = Math.floor(steps * progress);
    for (let s = 1; s <= maxStep; s++) {
      const t = s / steps;
      const mt = 1 - t;
      const x = mt*mt*mt*p.x1 + 3*mt*mt*t*p.cp1x + 3*mt*t*t*p.cp2x + t*t*t*p.x2;
      const y = mt*mt*mt*p.y1 + 3*mt*mt*t*p.cp1y + 3*mt*t*t*p.cp2y + t*t*t*p.y2;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

// ============ GUESS HANDLING ============
function handleGuess(word, btn) {
  if (!roundActive) return;

  if (word === currentWord) {
    // Correct!
    roundActive = false;
    if (animFrameId) cancelAnimationFrame(animFrameId);
    document.getElementById('next-btn').disabled = true;
    // Draw the full picture
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    currentPaths.forEach(p => drawPath(p, 1));

    btn.classList.add('correct-pick');

    // Calculate bonus: more points for guessing with fewer paths shown
    const pathsRemaining = currentPaths.length - currentPathIndex - 1;
    const earlyBonus = pathsRemaining * 5; // 5 points per path not yet shown
    const baseBonus = 10;
    const bonus = baseBonus + earlyBonus;
    score += bonus;
    updateUI();

    // Show score popup
    showScorePopup('+' + bonus);

    // Celebration
    launchConfetti();

    // Next level after delay
    setTimeout(() => {
      level++;
      updateUI();
      if (level <= maxLevel) {
        showLevelBanner();
        setTimeout(() => startRound(), 1200);
      } else {
        // Completed all levels!
        setTimeout(() => gameOver(true), 500);
      }
    }, 1500);
  } else {
    // Wrong - subtract 10 points
    btn.classList.add('wrong-pick');
    btn.disabled = true;
    score = Math.max(0, score - 10);
    updateUI();

    setTimeout(() => btn.classList.remove('wrong-pick'), 500);
  }
}

// ============ HINT ============
function showHint() {
  if (!currentWord || hintUsed || hintsRemaining <= 0) return;
  hintUsed = true;
  hintsRemaining--;
  document.getElementById('hint-text').textContent = DRAWINGS[currentWord].hint;
  document.getElementById('hint-btn').disabled = true;
  updateUI();
}

// ============ GAME OVER ============
function gameOver(completed) {
  const title = document.getElementById('gameover-title');
  title.textContent = completed ? 'You Win!' : 'Game Over!';

  document.getElementById('final-score-text').textContent = 'You scored ' + score + ' points!';
  document.getElementById('final-level-text').textContent = completed
    ? 'You completed all ' + maxLevel + ' levels!'
    : 'You reached Level ' + level + '!';

  // Check for high score
  const highScoreEntry = document.getElementById('high-score-entry');
  const finalScores = document.getElementById('final-high-scores');

  if (isHighScore(score)) {
    pendingHighScore = { score, levels: completed ? maxLevel : level - 1 };
    highScoreEntry.style.display = 'block';
    document.getElementById('player-name').value = '';
    document.getElementById('player-name').focus();
    finalScores.style.display = 'none';
  } else {
    highScoreEntry.style.display = 'none';
    displayHighScores('final-high-scores');
  }

  showScreen('gameover-screen');
}

function saveHighScore() {
  const nameInput = document.getElementById('player-name');
  const name = nameInput.value.trim() || 'Player';

  if (pendingHighScore) {
    const savedScore = addHighScore(name, pendingHighScore.score, pendingHighScore.levels);
    document.getElementById('high-score-entry').style.display = 'none';
    displayHighScores('final-high-scores', { name, score: pendingHighScore.score });
    pendingHighScore = null;
  }
}

// ============ CONFETTI ============
function launchConfetti() {
  const container = document.getElementById('celebration');
  container.style.display = 'block';
  container.innerHTML = '';
  const colors = ['#ff6b6b','#feca57','#54a0ff','#00b894','#ff9ff3','#a29bfe','#ff9f43','#10ac84'];

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
    piece.style.width = (8 + Math.random() * 10) + 'px';
    piece.style.height = (8 + Math.random() * 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    container.appendChild(piece);
  }
  setTimeout(() => { container.style.display = 'none'; container.innerHTML = ''; }, 2000);
}

// ============ LEVEL BANNER ============
function showLevelBanner() {
  const banner = document.getElementById('level-banner');
  banner.textContent = 'Level ' + level + '!';
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 1200);
}

// ============ SCORE POPUP ============
function showScorePopup(text) {
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = text;
  popup.style.left = '50%';
  popup.style.top = '40%';
  document.getElementById('game-screen').style.position = 'relative';
  document.getElementById('game-screen').appendChild(popup);
  setTimeout(() => popup.remove(), 1000);
}
